[project]
name = "gaspedaal-mcp"
version = "0.1.0"
description = "Lokale MCP-server die het occasion-aanbod van www.gaspedaal.nl doorzoekbaar maakt voor een taalmodel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.20,<2",
    "httpx>=0.28,<1",
]

[project.scripts]
gaspedaal-mcp = "gaspedaal_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaspedaal_mcp"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = [
    "live: live test against www.gaspedaal.nl (default off)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]